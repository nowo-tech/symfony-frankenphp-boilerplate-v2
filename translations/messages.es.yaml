    data_cookies: Cookies y tecnologías similares descritas en la página de Cookies
    purpose_heading: Finalidades
    purpose_body: Los datos se tratan para autenticar usuarios, operar el seguimiento de errores de los proyectos configurados, asegurar el servicio y (si está activo) recordar preferencias de cookies.
    retention_heading: Conservación
    retention_body: Los plazos de conservación los define el operador (ciclo de vida de cuentas, retención de proyectos, logs). Sustituye este párrafo por el calendario de tu organización.
    rights_heading: Tus derechos
    rights_body: Según la normativa aplicable (por ejemplo el RGPD), puedes tener derechos de acceso, rectificación, supresión, limitación, portabilidad y oposición. Contacta con el operador usando los datos del Aviso legal.
    cookies_heading: Cookies
    cookies_body: Usamos cookies necesarias para el acceso y el almacenamiento del consentimiento. Las categorías opcionales (preferencias, analítica) solo se activan si las permites en el banner de cookies.
  terms:
    title: Términos de uso
    intro: Estos términos regulan el uso de esta instancia de %brand%. El operador debe sustituir esta plantilla por términos acordes a su oferta (herramienta interna, SaaS, etc.).
    service_heading: Servicio
    service_body: App ofrece seguimiento autoalojado de errores y rendimiento para proyectos configurados por usuarios autorizados.
    accounts_heading: Cuentas
    accounts_body: Debes mantener la confidencialidad de tus credenciales y usar el servicio solo para proyectos y datos que estés autorizado a tratar.
    accept_heading: Uso aceptable
    accept_body: No abuses de la API de ingest, no intentes accesos no autorizados ni subas contenido ilícito. El operador puede suspender cuentas que incumplan estos términos.
    limitation_heading: Limitación de responsabilidad
    limitation_body: En la medida permitida por la ley, el operador y los autores del software no responden de daños indirectos derivados del uso del servicio. Revisa esta cláusula con asesoramiento legal.
    changes_heading: Cambios
    changes_body: El operador puede actualizar estos términos. El uso continuado tras el aviso puede implicar la aceptación de los términos actualizados cuando la ley lo permita.
  cookies:
    title: Aviso de cookies
    intro: Esta página describe las cookies y tecnologías similares utilizadas por esta instancia de %brand%. Las cookies estrictamente necesarias sustentan la autenticación, la seguridad y el registro del consentimiento. Las categorías opcionales se utilizan únicamente con su consentimiento previo. Use Configuración de cookies para revisar o modificar su selección en cualquier momento.
    categories_heading: Categorías
    cat_required: Estrictamente necesarias
    cat_required_help: Imprescindibles para la autenticación, la seguridad y el registro de su decisión de consentimiento. Estas cookies no pueden desactivarse.
    cat_preferences: Preferencias
    cat_preferences_help: Cookies opcionales que almacenan elecciones de presentación o de funciones no esenciales cuando el operador las habilita y usted las acepta.
    cat_analytics: Analítica
    cat_analytics_help: Cookies de medición opcionales, utilizadas solo si el operador activa herramientas de analítica y usted otorga su consentimiento previo.
    inventory_heading: Inventario de cookies
    col_name: Nombre
    col_category: Categoría
    col_duration: Duración
    col_purpose: Finalidad
    duration_session: Hasta 1 día
    duration_remember: Hasta 30 días
    duration_consent: Aproximadamente 1 año
    purpose_session: Mantiene la sesión HTTP autenticada necesaria para acceder a las áreas protegidas del servicio.
    purpose_remember: Permite la autenticación persistente cuando se selecciona «Recordarme» al iniciar sesión (token seguro; duración limitada).
    purpose_csrf: Cookie CSRF de doble envío de corta duración que Symfony establece al enviar formularios protegidos (patrón csrf-token_<token>; prefijo __Host- en HTTPS).
    purpose_consent: Cookie_Consent y Cookie_Consent_Key registran que se tomó una decisión de consentimiento y vinculan una clave anónima al registro de auditoría en el servidor.
    purpose_category: Cookie_Category_analytics y Cookie_Category_preferences almacenan si cada categoría opcional fue aceptada o rechazada (mecanismo de consentimiento, no rastreadores).
    storage_heading: Almacenamiento local
    storage_body: La preferencia de tema (claro/oscuro) y algunas opciones de interfaz pueden guardarse en el localStorage del navegador y no constituyen cookies HTTP. Según la orientación habitual sobre ePrivacy, puede tratarse como estrictamente necesaria para una interfaz coherente; el operador debe confirmar las normas aplicables en su jurisdicción.
error:
  home: Volver al inicio
  sign_in: Iniciar sesión
  generic:
    title: Desvío inesperado
    lead: Esa petición no llegó a buen puerto. No has roto nada — inténtalo de nuevo en un momento.
    hint: La mascota ya está buscando pistas debajo del sofá.
  400:
    title: Piezas del puzzle mezcladas
    lead: Esa petición no encaja del todo con la forma que esperábamos. Ajústala y envíala otra vez — no hay cristales rotos, solo esquinas que no casan.
    hint: La mascota sigue leyendo las instrucciones al revés. Nos pasa a los mejores.
    image_alt: Mascota App con piezas de puzzle y un triángulo de aviso junto a un 400
  401:
    title: Pase, por favor
    lead: Esta puerta pide un pase válido. Inicia sesión e inténtalo de nuevo — el portero es amable, solo un poco estricto.
    hint: Hasta los robots olvidan la tarjeta a veces. Guardamos una de repuesto en el mostrador.
    image_alt: Mascota App en un control de acceso con tarjeta junto a un 401
  403:
    title: La puerta está cerrada
    lead: No tienes las llaves de esta página. Inicia sesión con una cuenta autorizada o vuelve al inicio — no es nada personal.
    hint: Sobornar a la mascota con galletas tampoco abre el candado. Lo intentamos.
    image_alt: Mascota App junto a una puerta segura marcada 403
  404:
    title: Fuera del mapa
    lead: Esta ruta no existe en este App. Revisa la URL o vuelve al inicio — no hace falta una búsqueda del tesoro.
    hint: Hasta los mejores exploradores se pierden cuando el mapa va al revés.
    image_alt: Mascota App explorando con mapa y lupa junto a un 404
  408:
    title: Se acabó la arena
    lead: Esperamos con paciencia, pero la petición tardó demasiado. Prueba otra vez cuando todo vaya más vivo — sin prisas por tu parte.
    hint: La mascota sigue mirando el reloj. Los timeouts pasan; el café ayuda.
    image_alt: Mascota App con un reloj de arena y un despertador junto a un 408
  429:
    title: Pausa suave
    lead: Has enviado peticiones un poco más rápido de lo que podemos hacer malabares. Respira un momento y sigue — la cola se vaciará.
    hint: La mascota ha pulsado pausa en la cinta. No es un regañazo — más bien un estiramiento.
    image_alt: Mascota App pausando una cola de mensajes junto a un 429
  500:
    title: Un hipo del App
    lead: Algo tropezó de nuestro lado, no del tuyo. Espera un poco e inténtalo otra vez — no has hecho nada mal.
    hint: Estamos dando toquecitos al servidor con una llave inglesa. Con mucho mimo.
    image_alt: Mascota App reparando un rack de servidores marcado 500
  502:
    title: Cable desenchufado
    lead: Un enlace entre servicios se aflojó. Estamos reconectando — prueba en un momento; no has hecho nada mal.
    hint: La mascota está uniendo el cable luminoso. Las chispas son a propósito. Probablemente.
    image_alt: Mascota App reconectando un cable luminoso entre servidores junto a un 502
