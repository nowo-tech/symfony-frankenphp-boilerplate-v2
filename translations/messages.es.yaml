instance_mailer:
  mailer_dsn:
    label: DSN de Mailer
    help: Déjalo vacío para conservar el valor cifrado actual. Ejemplo smtp://user:pass@mail.example:587 — null:// se rechaza (usa Borrar DSN guardado).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Introduce un DSN de Symfony Mailer válido (por ejemplo smtp://user:pass@host:587).
    null_transport: null:// no puede entregar correo. Pega un DSN SMTP (u otro) real, o usa Borrar DSN guardado para volver al entorno.
    scheme_not_allowed: Ese esquema de DSN de Mailer no está permitido. Usa smtp, smtps o un proveedor soportado (Mailgun, Postmark, SES, …).
  clear_dsn:
    label: Borrar DSN guardado
    help: Elimina el DSN de la base de datos y vuelve a MAILER_DSN del entorno hasta que guardes uno nuevo.
  mailer_from:
    label: Dirección From
    help: Remitente para magic login y notificaciones por email. Por defecto app@localhost si está vacío.
    placeholder: app@example.com
