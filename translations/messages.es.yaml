mailer_settings:
  title: Correo
  intro: Guarda el DSN de Symfony Mailer cifrado en la base de datos (no en .env). El magic login permanece oculto hasta que haya un DSN distinto de null aquí; los destinos de notificación por email también usan este transporte.
  status:
    database: El correo saliente usa el DSN guardado en los ajustes de instancia. El magic login está disponible si ese DSN no es un transporte null.
    env_fallback: Aún no hay DSN en base de datos — se usa MAILER_DSN del entorno (normalmente null://null). El magic login permanece desactivado hasta que guardes un DSN cifrado aquí.
  current_dsn: 'DSN actual:'
  from_preview: 'Dirección From: %from%'
  submit: Guardar correo
  magic_ready: Credenciales de email para magic login listas
  magic_blocked: Magic login por email no disponible (guarda un DSN cifrado usable)
  sample:
    title: Enviar correo de muestra
    intro: Envía un mensaje de prueba con el DSN cifrado (el mismo transporte que el magic login).
    to_label: Destinatario
    submit: Enviar muestra
    unavailable: Guarda primero un DSN de Mailer cifrado válido (no null://) para poder enviar una muestra.
    email_subject: Muestra de correo App (credenciales magic login)
    email_body: |
      Este es un mensaje de muestra de Administración → Correo.

      Si lo has recibido, el DSN cifrado de Mailer puede entregar emails de magic login.
      Remitente: %from%
settings:
  instance_config:
    title: Configuración de instancia
    intro: Exporta o importa ajustes no secretos de la lista permitida (apariencia y flags de instancia). El DSN de Mailer, los secretos de Mercure y los secretos OAuth nunca se incluyen.
    export_title: Exportar
    export_help: Descarga un archivo JSON versionado seguro para ensayos de copia de seguridad. Los secretos permanecen en esta instancia.
    export: Descargar JSON
    import_title: Importar
    import_help: Restaura la apariencia y los flags permitidos desde una exportación anterior. Los valores secretos se rechazan y no se modifican.
    import: Importar JSON
    file: Archivo de configuración
    imported: Configuración de instancia importada.
    import_failed: Falló la importación. Comprueba la versión del esquema y que el archivo no tenga claves secretas.
