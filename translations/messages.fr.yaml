legal:
  nav:
    label: Légal
  last_updated: 'Dernière mise à jour : %date%'
  manage_cookies: Paramètres des cookies
  placeholder:
    legal_name: 'Nom légal : [Nom légal de l''opérateur — remplacer]'
    address: 'Adresse : [Adresse enregistrée — remplacer]'
    contact_email: 'Contact : [privacy@example.com — remplacer]'
    registration: 'Registre des sociétés / numéro d''identification fiscale : [le cas échéant — remplacer]'
  notice:
    title: Mentions légales
    intro: Ces mentions légales s'appliquent à l'instance %brand% auto-hébergée que vous visitez. Remplacez les espaces réservés ci-dessous par les détails réels de l’opérateur avant utilisation publique.
    operator_heading: Opérateur
    operator_body: L'opérateur de cette instance est responsable du service et du contenu qu'il publie ici.
    hosting_heading: Hébergement
    hosting_body: Ce logiciel peut être hébergé chez l'opérateur ou chez un fournisseur d'infrastructure tiers choisi par l'opérateur. Les détails de l’hébergement doivent être complétés par l’opérateur.
    liability_heading: Responsabilité
    liability_body: Le logiciel est fourni tel quel. L'opérateur reste responsable de l'utilisation licite, du respect de la protection des données et de l'exactitude du texte juridique spécifique à l'opérateur en la matière.
  privacy:
    title: Politique de confidentialité
    intro: Cette politique de confidentialité décrit la manière dont les données personnelles peuvent être traitées lorsque vous utilisez cette instance %brand%. Les opérateurs doivent adapter ce texte à leur organisation et à leur juridiction.
    controller_heading: Responsable du traitement des données
    controller_body: L'opérateur de cette instance App est le contrôleur des données pour les comptes et la télémétrie stockés sur leur déploiement. Remplissez le nom légal et les coordonnées dans la page Mentions légales.
    data_heading: Données que nous traitons
    data_body: 'Selon la manière dont l''opérateur configure et utilise l''instance, le traitement peut inclure :'
    data_account: Données du compte (e-mail, nom d'affichage, hachage du mot de passe, rôles, préférences)
    data_telemetry: Erreur d'application et télémétrie de performances envoyées via le DSN du projet / l'ingestion d'enveloppe
    data_logs: Journaux opérationnels et journaux de consentement aux cookies facultatifs
    data_cookies: Cookies et technologies similaires décrits sur la page Cookies
    purpose_heading: Objectifs
    purpose_body: Les données sont traitées pour authentifier les utilisateurs, effectuer le suivi des erreurs pour les projets configurés, sécuriser le service et (si activé) mémoriser les préférences en matière de cookies.
    retention_heading: Rétention
    retention_body: Les durées de conservation sont définies par l'opérateur (cycle de vie du compte, conservation des données du projet, conservation des logs). Remplacez ce paragraphe par le calendrier de conservation de votre organisation.
    rights_heading: Vos droits
    rights_body: En fonction de la loi applicable (par exemple RGPD), vous pouvez disposer de droits d'accès, de rectification, d'effacement, de restriction, de portabilité et d'opposition. Contactez l'opérateur en utilisant les coordonnées figurant sur la page Mentions légales.
    cookies_heading: Cookies
    cookies_body: Nous utilisons les cookies nécessaires à la connexion et au stockage du consentement. Les catégories facultatives (préférences, analyses) ne sont activées qu'après que vous les ayez autorisées dans la bannière des cookies.
  terms:
    title: Conditions d'utilisation
    intro: Ces termes régissent l'utilisation de cette instance %brand%. Les opérateurs doivent remplacer ce modèle par des termes correspondant à leur offre (outil interne, SaaS client, etc.).
    service_heading: Service
    service_body: App fournit un suivi des erreurs et des performances auto-hébergé pour les projets configurés par des utilisateurs autorisés.
    accounts_heading: Comptes
    accounts_body: Vous devez garder vos informations d'identification confidentielles et utiliser le service uniquement pour les projets et les données que vous êtes autorisé à traiter.
    accept_heading: Utilisation acceptable
    accept_body: N'abusez pas de l'API d'ingestion, ne tentez pas d'accès non autorisé ou ne téléchargez pas de contenu illégal. L'opérateur peut suspendre les comptes qui violent ces conditions.
    limitation_heading: Limitation de responsabilité
    limitation_body: Dans la mesure permise par la loi, l'opérateur et les auteurs de logiciels ne sont pas responsables des dommages indirects résultant de l'utilisation du service. Les exploitants devraient demander à un avocat de revoir cette clause.
    changes_heading: Changements
    changes_body: L'opérateur peut mettre à jour ces conditions. L'utilisation continue après notification constitue l'acceptation des conditions mises à jour lorsque la loi le permet.
  cookies:
    title: Avis relatif aux cookies
    intro: Cette page décrit les cookies et technologies similaires utilisés par cette instance %brand%. Les cookies strictement nécessaires soutiennent l’authentification, la sécurité et l’enregistrement du consentement. Les catégories facultatives ne sont utilisées qu’avec votre consentement préalable. Utilisez les Paramètres des cookies pour consulter ou modifier votre sélection à tout moment.
    categories_heading: Catégories
    cat_required: Strictement nécessaires
    cat_required_help: Indispensables à l’authentification, à la sécurité et à l’enregistrement de votre décision de consentement. Ces cookies ne peuvent pas être désactivés.
    cat_preferences: Préférences
    cat_preferences_help: Cookies facultatifs qui mémorisent des choix de présentation ou de fonctionnalités non essentiels lorsque l’opérateur les active et que vous y consentez.
    cat_analytics: Analytique
    cat_analytics_help: Cookies de mesure facultatifs, utilisés uniquement si l’opérateur active des outils d’analytique et que vous donnez votre consentement préalable.
    inventory_heading: Inventaire des cookies
    col_name: Nom
    col_category: Catégorie
    col_duration: Durée
    col_purpose: Finalité
    duration_session: Jusqu’à 1 jour
    duration_remember: Jusqu’à 30 jours
    duration_consent: Environ 1 an
    purpose_session: Maintient la session HTTP authentifiée nécessaire pour accéder aux zones protégées du service.
    purpose_remember: Permet une authentification persistante lorsque « Se souvenir de moi » est sélectionné à la connexion (jeton sécurisé ; durée limitée).
    purpose_csrf: Cookie CSRF double-soumission de courte durée défini par Symfony lors de l’envoi de formulaires protégés (motif csrf-token_<token> ; préfixe __Host- en HTTPS).
    purpose_consent: Cookie_Consent et Cookie_Consent_Key enregistrent qu’une décision de consentement a été prise et relient une clé anonyme au journal d’audit côté serveur.
    purpose_category: Cookie_Category_analytics et Cookie_Category_preferences enregistrent si chaque catégorie facultative a été acceptée ou refusée (mécanisme de consentement, pas des trackers).
    storage_heading: Stockage local
    storage_body: La préférence de thème (clair/sombre) et certains choix d’interface peuvent être stockés dans le localStorage du navigateur et ne constituent pas des cookies HTTP. Selon les orientations ePrivacy habituelles, cela peut être traité comme strictement nécessaire pour une interface cohérente ; les opérateurs doivent confirmer les règles applicables dans leur juridiction.
