legal:
  nav:
    label: Legaal
  last_updated: 'Laatst bijgewerkt: %date%'
  manage_cookies: Cookie-instellingen
  placeholder:
    legal_name: 'Wettelijke naam: [wettelijke naam exploitant — vervangen]'
