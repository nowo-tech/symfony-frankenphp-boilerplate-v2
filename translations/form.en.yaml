# Host FormKit catalogue (REQ-FORMKIT-003). Domain: form
# Keys: {block_prefix}.{field}.label|placeholder|help + static choice maps.
user_filter:
  q:
    label: Search
    placeholder: Search by name or email…
    help: Filter the user directory by display name or email.

group_filter:
  q:
    label: Search
    placeholder: Search by name, slug, or description…
    help: Filter groups by name, slug, or description.

role_filter:
  q:
    label: Search
    placeholder: Search by name or code…
    help: Filter roles by display name or machine code.

permission_filter:
  q:
    label: Search
    placeholder: Search by key, name, category…
    help: Filter permissions by key, name, or category.

admin_user:
  email:
    label: Email
    placeholder: name@example.com
    help: Sign-in email for this account.
  display_name:
    label: Display name
    placeholder: Jane Doe
    help: Shown in the admin directory and activity timeline.
  password:
    label: Password
    placeholder: At least 8 characters
    help: At least 8 characters.
  role:
    label: Role
    placeholder: Select a role
    help: Instance role (user or admin).
  enabled:
    label: Account enabled (can sign in)
    placeholder: ''
    help: When disabled, the user cannot sign in.

admin_instance_role:
  name:
    label: Name
    placeholder: Support
    help: Database fallback for the display name. UI prefers roles.catalog.<slug>.name when that key is
      translated (slug = lowercase code).
  code:
    label: Code
    placeholder: ROLE_SUPPORT
    help: Symfony-style code (e.g. ROLE_SUPPORT). Stored as the machine id — not translated.
  description:
    label: When to use
    placeholder: Optional short guidance…
    help: Short guidance on when to assign this role. Prefer roles.catalog.<slug>.description; this field
      is the database fallback.
  enabled:
    label: Enabled
    help: When disabled, this role cannot be newly assigned.

admin_instance_permission:
  key:
    label: Permission key
    help: Lowercase dotted machine name used in isGranted('project.view'). Not translated.
    placeholder: e.g. project.custom.manage
  category:
    label: Category
    help: Choose a category. Option labels follow the current UI language; the stored value is the machine
      slug.
    placeholder: Choose a category…
  name:
    help_default: Required for the default language (%locale%). Saved per language; the UI uses the active
      locale, then the catalog, then this value.
    help_locale: Optional for %locale%. Overrides the catalog name when set.
  description:
    help_locale: Optional for %locale%. Overrides the catalog description when set.
  name_en:
    label: Display name
  description_en:
    label: Description
  name_es:
    label: Display name
  description_es:
    label: Description
  name_de:
    label: Display name
  description_de:
    label: Description
  name_fr:
    label: Display name
  description_fr:
    label: Description
  name_it:
    label: Display name
  description_it:
    label: Description
  name_nl:
    label: Display name
  description_nl:
    label: Description
  name_pt:
    label: Display name
  description_pt:
    label: Description

site_appearance:
  brand_name:
    label: Brand name
    placeholder: symfony-shell
    help: Shown in the header and on the login page.
  brand_eyebrow:
    label: Brand eyebrow
    placeholder: Platform shell
    help: Short label above the brand on the login screen.
  accent_color:
    label: Accent
    placeholder: '#1f6f54'
    help: Primary accent (buttons, links) in light mode.
  accent_deep_color:
    label: Accent (hover)
    placeholder: '#134736'
    help: Darker accent for hover states in light mode.
  accent_color_dark:
    label: Accent (dark)
    placeholder: '#4aad7f'
    help: Primary accent in dark mode.
  accent_deep_color_dark:
    label: Accent hover (dark)
    placeholder: '#6bc49a'
    help: Lighter accent for hover states in dark mode.
  danger_color:
    label: Danger
    placeholder: '#b42318'
    help: Error / destructive accent in light mode.
  danger_color_dark:
    label: Danger (dark)
    placeholder: '#f97066'
    help: Error / destructive accent in dark mode.
  warn_color:
    label: Warning
    placeholder: '#b54708'
    help: Warning / caution accent in light mode.
  warn_color_dark:
    label: Warning (dark)
    placeholder: '#fdb022'
    help: Warning / caution accent in dark mode.
  paper_color:
    label: Paper
    placeholder: '#f3f6f4'
    help: Page background in light mode.
  paper_color_dark:
    label: Paper (dark)
    placeholder: '#0c1210'
    help: Page background in dark mode.
  ink_color:
    label: Ink
    placeholder: '#0f1c18'
    help: Primary text color in light mode.
  ink_color_dark:
    label: Ink (dark)
    placeholder: '#e6eee9'
    help: Primary text color in dark mode.
  surface_color:
    label: Surface
    placeholder: '#ffffff'
    help: Panels and cards in light mode.
  surface_color_dark:
    label: Surface (dark)
    placeholder: '#151c19'
    help: Panels and cards in dark mode.
  footer_fixed:
    label: Fixed footer
    help: Keep the legal footer pinned to the bottom of the viewport while page content scrolls.
  corner_style:
    label: Corner style
    help: Cards use a larger radius; inputs and buttons stay subtler.
    choice:
      sharp: Sharp
      soft: Soft (default)
      rounded: Rounded
  border_strength:
    label: Border strength
    help: How defined element borders look in light and dark mode (panels, inputs, chrome).
    choice:
      subtle: Subtle
      medium: Medium (default)
      strong: Strong
  color:
    invalid: 'Use a hex color like #1f6f54.'

instance_mailer:
  plain_mailer_dsn:
    label: Mailer DSN
    help: Leave blank to keep the current encrypted value. Example smtp://user:pass@mail.example:587 —
      null:// is rejected (use Clear stored DSN instead).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Enter a valid Symfony Mailer DSN (for example smtp://user:pass@host:587).
    null_transport: null:// cannot deliver mail. Paste a real SMTP (or other) DSN,
      or use Clear stored DSN to fall back to the environment.
    scheme_not_allowed: That Mailer DSN scheme is not allowed. Use smtp, smtps, or
      a supported provider scheme (Mailgun, Postmark, SES, …). Sendmail/native DSNs
      are blocked because they can execute host commands.
  clear_mailer_dsn:
    label: Clear stored DSN
    help: Removes the database DSN and falls back to MAILER_DSN from the environment until you save a
      new one.
  mailer_from:
    label: From address
    help: Envelope From for magic-login and notification emails. Defaults to beacon@localhost when empty.
    placeholder: beacon@example.com

user_preferences:
  display_name:
    label: Display name
    placeholder: Your name
    help: Shown in the avatar menu and member lists.
  email:
    label: Email
    placeholder: you@example.com
    help: Used to sign in.
  slack_user_id:
    label: Slack user ID
    placeholder: U012ABCDEF
    help: 'Optional. Your Slack member ID enables Assign/Resolve on Slack alerts. Changing it requires your current password. Find it in Slack → profile → … → Copy member ID.'
  phone:
    label: Phone number
    placeholder: '600 111 222'
    help: Optional. Country code + national number (E.164). Reserved for future SMS OTP / phone sign-in. Changing or clearing the number removes any previous phone verification.
  preferred_locale:
    label: Language
    placeholder: Auto
    help: Preferred UI language for this account.
  preferred_theme:
    label: Theme
    placeholder: Auto
    help: Preferred day or night appearance.
  preferred_content_width:
    label: Content width
    placeholder: Content
    help: Centered content column, or stretch the main area full width.
  preferred_ui_density:
    label: UI density
    placeholder: Comfortable
    help: Comfortable spacing, or a more compact operator layout.
  preferred_font_scale:
    label: Text size
    placeholder: Medium
    help: Scale the interface text smaller or larger.
  preferred_contrast:
    label: Contrast
    placeholder: System
    help: Follow the device contrast preference, or force stronger text and borders.
  preferred_sidebar:
    label: Sidebar
    placeholder: Expanded
    help: Default desktop sidebar state when this browser has no saved preference yet.
  preferred_motion:
    label: Motion
    placeholder: System
    help: Follow the device preference, reduce animations, or keep full motion.
  preferred_collapsed_issue_panels:
    label: Issue panels collapsed by default
    placeholder: Select panels…
    help: Checked panels start collapsed on issue and event detail pages. Your browser remembers
      manual open/close overrides.
  current_password:
    label: Current password
    placeholder: Current password
    help: Required only when setting a new password.
    help_email_change: Required when changing your email address (login and password-reset destination).
    help_sensitive_change: Required when changing your email or Slack user ID.
    help_required: Confirm your current password to set a new one.
  plain_password:
    label: New password
    placeholder: New password
    help: Choose a strong password that meets the requirements below.
    mismatch: The password fields must match.
    strength_invalid: The password does not meet the strength requirements (%missing%).
    second:
      label: Confirm new password
    first:
      label: New password
  plain_password_confirm:
    label: Confirm new password
    placeholder: Confirm new password
    help: Re-enter your new password.

social_login_credential:
  provider:
    label: Provider key
    help: Lowercase slug (google, github, microsoft, or custom).
    invalid: Use a lowercase slug starting with a letter (a-z, digits, _ or -).
  label:
    label: Button label
    help: Shown on the login page Continue-with button.
  client_id:
    label: Client ID
  client_secret:
    label: Client secret
    help_new: OAuth client secret from the IdP app registration.
    help_edit: Leave blank to keep the current secret.
  enabled:
    label: Enabled
    help: Disabled providers stay in the database but do not show on login.
  enterprise_sso:
    label: Enterprise SSO
    help: Show under “Sign in with your organization” instead of consumer social buttons (OIDC IdPs).
  authorize_url:
    label: Authorize URL
    help: Optional for built-in providers; required for custom IdPs.
  token_url:
    label: Token URL
    help: Optional for built-in providers; required for custom IdPs.
  userinfo_url:
    label: Userinfo URL
    help: Optional for built-in providers; required for custom IdPs.
  scopes:
    label: Scopes
    help: Optional space- or comma-separated OAuth scopes.

admin_group_member_add:
  email:
    label: Member email
    placeholder: user@example.com

admin_role_user_add:
  email:
    label: User email
    placeholder: user@example.com

groups:
  description_label: Description
  name_label: Name

instance_config_import:
  config:
    label: Config file

mailer_test:
  to:
    label: Recipient
    placeholder: you@example.com

admin:
  ops:
    filter_project: Project filter

admin_group:
  name:
    label: Name
    placeholder: Support team
    help: Short group name shown in admin lists.
  description:
    label: Description
    placeholder: Optional notes…
    help: Optional longer description for operators.

users:
  role:
    admin: Admin
    user: User

preferences:
  theme_light: Day
  theme_dark: Night
  width_content: Content (centered)
  width_full: Full width
  density_comfortable: Comfortable
  density_compact: Compact
  font_scale_sm: Small
  font_scale_md: Medium
  font_scale_lg: Large
  contrast_system: System (follow device)
  contrast_more: More contrast
  sidebar_expanded: Expanded
  sidebar_collapsed: Collapsed
  motion_system: System (follow device)
  motion_reduce: Reduce motion
  motion_full: Full motion

permissions:
  key_invalid: Use lowercase dotted segments (at least two), e.g. project.custom.manage.
  category:
    access:
      name: Access
      description: Account access and identity administration (users, groups, roles, permissions).
    overview:
      name: Overview
      description: Administration hub and ops summary views.
    instance:
      name: Instance
      description: Instance-wide configuration (appearance, mailer, social login, setup, backups).
    navigation:
      name: Navigation & legal
      description: Menus, breadcrumbs, public routing, and cookie consent.
    observability:
      name: Observability
      description: HTTP request log and API documentation surfaces.
    general:
      name: General
      description: Uncategorized or legacy permission keys.
    custom:
      name: Custom
      description: Operator-defined permission keys outside the seeded catalog.

