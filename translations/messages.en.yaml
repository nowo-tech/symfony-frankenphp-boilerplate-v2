social_login_settings:
  title: Social login
  intro: Store OAuth app credentials in the database (AuthKit table auth_kit_social_credential). Login buttons appear when social_login.mode is enabled and at least one credential row is enabled.
  status:
    active: Social login buttons are active on the login page.
    inactive: Social login is not showing buttons yet (enable the AuthKit profile mode and add at least one enabled provider below).
  redirect_hint: Register redirect URIs at each IdP as %uri%/login/social/{provider}/check (and /{locale}/… for non-default locales).
  create: Add provider
  empty: No OAuth providers configured yet.
  enabled: true
  disabled: false
  edit: Edit
  delete: Remove
  delete_confirm: Remove this OAuth provider credential?
