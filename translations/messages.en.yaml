  notice:
    title: Legal notice
    intro: This legal notice applies to the self-hosted %brand% instance you are visiting. Replace the placeholders below with the operator’s real details before public use.
    operator_heading: Operator
    operator_body: The operator of this instance is responsible for the service and for the content they publish here.
    hosting_heading: Hosting
    hosting_body: This software may be hosted by the operator or a third-party infrastructure provider chosen by the operator. Hosting details should be completed by the operator.
    liability_heading: Liability
    liability_body: The software is provided as-is. The operator remains responsible for lawful use, data protection compliance, and the accuracy of operator-specific legal text on this instance.
  privacy:
    title: Privacy policy
    intro: This privacy policy describes how personal data may be processed when you use this %brand% instance. Operators must adapt this text to their organisation and jurisdiction.
    controller_heading: Data controller
    controller_body: The operator of this App instance is the data controller for accounts and telemetry stored on their deployment. Fill in legal name and contact details in the Legal notice page.
    data_heading: Data we process
    data_body: 'Depending on how the operator configures and uses the instance, processing may include:'
    data_account: Account data (email, display name, password hash, roles, preferences)
    data_telemetry: Application error and performance telemetry sent via project DSN / Envelope ingest
    data_logs: Operational logs and optional cookie consent logs
    data_cookies: Cookies and similar technologies described on the Cookies page
    purpose_heading: Purposes
    purpose_body: Data is processed to authenticate users, operate error tracking for configured projects, secure the service, and (where enabled) remember cookie preferences.
    retention_heading: Retention
    retention_body: Retention periods are defined by the operator (account lifecycle, project data retention, log retention). Replace this paragraph with your organisation’s retention schedule.
    rights_heading: Your rights
    rights_body: Depending on applicable law (for example GDPR), you may have rights of access, rectification, erasure, restriction, portability, and objection. Contact the operator using the details on the Legal notice page.
    cookies_heading: Cookies
    cookies_body: We use necessary cookies for sign-in and consent storage. Optional categories (preferences, analytics) are only activated after you allow them in the cookie banner.
  terms:
    title: Terms of use
    intro: These terms govern use of this %brand% instance. Operators should replace this template with terms that match their offering (internal tool, customer SaaS, etc.).
    service_heading: Service
    service_body: App provides self-hosted error and performance tracking for projects configured by authorised users.
    accounts_heading: Accounts
    accounts_body: You must keep credentials confidential and use the service only for projects and data you are authorised to process.
    accept_heading: Acceptable use
    accept_body: Do not abuse the ingest API, attempt unauthorised access, or upload unlawful content. The operator may suspend accounts that violate these terms.
    limitation_heading: Limitation of liability
    limitation_body: To the extent permitted by law, the operator and software authors are not liable for indirect damages arising from use of the service. Operators should have counsel review this clause.
    changes_heading: Changes
    changes_body: The operator may update these terms. Continued use after notice constitutes acceptance of the updated terms where permitted by law.
  cookies:
    title: Cookie notice
    intro: This page describes the cookies and similar technologies used by this %brand% instance. Strictly necessary cookies support authentication, security, and consent recording. Optional categories are used only with your prior consent. Use Cookie settings to review or change your selection at any time.
    categories_heading: Categories
    cat_required: Strictly necessary
    cat_required_help: Essential for authentication, security, and recording your consent decision. These cookies cannot be disabled.
    cat_preferences: Preferences
    cat_preferences_help: Optional cookies that store non-essential presentation or feature choices when enabled by the operator and accepted by you.
    cat_analytics: Analytics
    cat_analytics_help: Optional measurement cookies used only if the operator enables analytics tooling and you give prior consent.
    inventory_heading: Cookie inventory
    col_name: Name
    col_category: Category
    col_duration: Duration
    col_purpose: Purpose
    duration_session: Up to 1 day
    duration_remember: Up to 30 days
    duration_consent: Approximately 1 year
    purpose_session: Maintains the authenticated HTTP session required to access protected areas of the service.
    purpose_remember: Enables persistent authentication when “Remember me” is selected at sign-in (secure token; limited lifetime).
    purpose_csrf: Short-lived double-submit CSRF cookie set by Symfony when submitting protected forms (name pattern csrf-token_<token>; __Host- prefix on HTTPS).
    purpose_consent: Cookie_Consent and Cookie_Consent_Key record that a consent decision was made and link an anonymous key to the server-side consent audit log.
    purpose_category: Cookie_Category_analytics and Cookie_Category_preferences store whether each optional category was accepted or refused (consent machinery, not trackers).
    storage_heading: Local storage
    storage_body: Theme preference (light/dark) and some UI layout choices may be stored in the browser’s localStorage and are not HTTP cookies. Under typical ePrivacy guidance this may be treated as strictly necessary for a coherent user interface; operators should confirm the applicable rules in their jurisdiction.
error:
  home: Back to home
  sign_in: Sign in
  generic:
    title: Unexpected detour
    lead: That request did not land. Nothing you typed set anything on fire — try again in a moment.
    hint: Our mascot is already looking under the sofa cushions for clues.
  400:
    title: Puzzle pieces mixed up
    lead: That request did not quite fit the shape we expected. Tweak it and send it again — no broken glass, just mismatched corners.
    hint: Our mascot is still reading the instructions upside down. Happens to the best of us.
    image_alt: App mascot with puzzle pieces and a warning triangle next to a large 400
  401:
    title: Badge check, please
    lead: This door needs a valid pass. Sign in, then try again — the gatekeeper is friendly, just thorough.
    hint: Even robots forget their access cards sometimes. We keep a spare at the desk.
    image_alt: App mascot at a checkpoint holding an access card next to a large 401
  403:
    title: Gate's closed
    lead: You do not have the keys for this page. Sign in with an allowed account, or head home — the lock is not personal.
    hint: Bribing the mascot with cookies still will not open it. We tried.
    image_alt: App mascot beside a secured gate marked 403
  404:
    title: Off the map
    lead: This path is not on this App. Check the URL spelling, or follow the light home — no scavenger hunt required.
    hint: Even the best explorers take a wrong turn when the map is upside down.
    image_alt: App mascot exploring with a map and magnifying glass next to a large 404
  408:
    title: Hourglass ran out
    lead: We waited patiently, but the request took too long. Try again when things feel a bit snappier — no rush on your side.
    hint: Our mascot is still staring at the clock. Timeouts happen; coffee helps.
    image_alt: App mascot with an hourglass and alarm clock next to a large 408
  429:
    title: Soft pause button
    lead: You sent requests a little faster than we can juggle. Take a short breather, then continue — the queue will clear.
    hint: Our mascot hit pause on the conveyor. Not a scolding — more of a stretch break.
    image_alt: App mascot pausing a message queue next to a large 429
  500:
    title: App hiccup
    lead: Something tripped on our side, not yours. Wait a bit and try again — you did nothing wrong.
    hint: We are gently poking the servers with a wrench. Very gently.
    image_alt: App mascot repairing a server rack marked 500
  502:
    title: Cable unplugged
    lead: A link between services went soft. We are plugging things back in — try again in a moment; you did nothing wrong.
    hint: Our mascot is reconnecting the glow cable. Sparks are intentional. Probably.
    image_alt: App mascot reconnecting a glowing cable between servers next to a large 502
  503:
    title: Under maintenance
    lead: We are making a few gentle improvements. Everything you care about is safe — check back in a moment.
    hint: Our hermit crab brought a wrench and a sandwich board. Tea is optional.
    image_alt: Nowo Shell hermit crab mascot with a wrench beside a large 503 under maintenance sign
