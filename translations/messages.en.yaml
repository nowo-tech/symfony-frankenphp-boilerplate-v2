instance_mailer:
  mailer_dsn:
    label: Mailer DSN
    help: Leave blank to keep the current encrypted value. Example smtp://user:pass@mail.example:587 — null:// is rejected (use Clear stored DSN instead).
    placeholder: smtp://user:pass@mail.example:587
    invalid: Enter a valid Symfony Mailer DSN (for example smtp://user:pass@host:587).
    null_transport: null:// cannot deliver mail. Paste a real SMTP (or other) DSN, or use Clear stored DSN to fall back to the environment.
    scheme_not_allowed: That Mailer DSN scheme is not allowed. Use smtp, smtps, or a supported provider scheme (Mailgun, Postmark, SES, …). Sendmail/native DSNs are blocked because they can execute host commands.
  clear_dsn:
    label: Clear stored DSN
    help: Removes the database DSN and falls back to MAILER_DSN from the environment until you save a new one.
  mailer_from:
    label: From address
    help: Envelope From for magic-login and notification emails. Defaults to app@localhost when empty.
    placeholder: app@example.com
