admin_group:
  name:
    label: Nombre
    placeholder: Equipo de soporte
    help: Nombre corto del grupo en listados de administración.
  description:
    label: Descripción
    placeholder: Notas opcionales…
    help: Descripción opcional para operadores.

permissions:
  key_invalid: Usa segmentos en minúsculas con puntos (al menos dos), p. ej. project.custom.manage.
  category:
    access:
      name: Acceso
      description: Acceso a cuentas y administración de identidad (usuarios, grupos, roles, permisos).
    overview:
      name: Resumen
      description: Hub de administración y vistas de resumen ops.
    instance:
      name: Instancia
      description: Configuración de instancia (apariencia, correo, login social, setup, backups).
    navigation:
      name: Navegación y legal
      description: Menús, migas de pan, rutas públicas y consentimiento de cookies.
    observability:
      name: Observabilidad
      description: Log HTTP y documentación de API.
    general:
      name: General
      description: Claves de permiso sin categorizar o heredadas.
    custom:
      name: Personalizado
      description: Claves definidas por el operador fuera del catálogo sembrado.

