# nowo-tech/breadcrumb-kit-bundle
# https://github.com/nowo-tech/BreadcrumbKitBundle
# Administration pages: UiKit 2 scaffolds (layouts/ui_admin.html.twig + nowo_ui_kit.theme), no templates/bundles/ copy.
nowo_breadcrumb_kit:
    locales: '%fallback_locales%'
    default_locale: '%default_locale%'
    default_collection: 'default'
    cache:
        ttl: 60
        pool: cache.app
    presentation:
        home_icon: null
        home_icon_replaces_label: true
        hide_when_single_root: true
    # UiKit 2 page contract (BreadcrumbKit ≥2.7): the dashboard pages extend UiKit scaffolds in
    # nowo_ui_kit.layouts.admin (layouts/ui_admin.html.twig), classes from nowo_ui_kit.theme, forms in UiKit dialogs.
    web_ui:
        enabled: true
        path_prefix: /breadcrumb-kit-admin
        # Create / edit has many CSS fields.
        dialog_sizes:
            collection_form: xl
            item_form: lg
            import: md
        pagination:
            enabled: true
            per_page: 20
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
