# nowo-tech/http-log-bundle — HTTP request/response audit log + admin UI
# https://github.com/nowo-tech/HttpLogBundle
#
# Admin UI: UiKit 2 scaffolds (HttpLog ≥1.8) in layouts/ui_admin.html.twig, classes from nowo_ui_kit.theme; no fork.
nowo_http_log:
    enabled: true
    environments: []
    async: true
    sampling_rate: 1.0
    track_sub_requests: false
    ignore_routes:
        - '_wdt'
        - '_profiler'
        - 'web_profiler*'
        - 'nowo_http_log_*'
        - 'ingest_*'
        - 'health_*'
        - 'metrics_*'
        # AuthKit recovery tokens live in the path; never persist them in HTTP audit logs.
        - 'nowo_auth_kit_reset_password*'
        - 'nowo_auth_kit_magic_login_*'
        - 'nowo_device_intelligence*'
    ignore_path_prefixes:
        - '/admin/http-log'
        - '/api'
        - '/health'
        - '/metrics'
        - '/build'
        - '/assets'
        - '/_wdt'
        - '/_profiler'
        - '/reset-password'
        - '/login/magic'
        - '/_device'
    capture:
        request_headers: true
        request_body: false
        response_headers: true
        client_ip: true
        user: true
        max_body_bytes: 65536
        response_body_by_type:
            html: false
            json: true
            soap: true
            xml: true
            text: false
            binary: false
            other: false
    redaction:
        headers:
            - Authorization
            - Cookie
            - Set-Cookie
            - X-Api-Key
            - X-Slack-Signature
        query_params:
            - password
            - token
            - api_key
        json_paths:
            - '*.password'
            - '*.token'
            - '*.secret'
    retention:
        days: 30
    export:
        formats:
            - csv
            - json
        max_sync_rows: 1000
    web_ui:
        enabled: true
        path_prefix: /admin/http-log
        # UiKit 2 page contract (HttpLog ≥1.8): the pages extend UiKit scaffolds in nowo_ui_kit.layouts.admin
        # (layouts/ui_admin.html.twig) and take their classes from nowo_ui_kit.theme — no layout / chrome keys here.
        page_size: 50
    security:
        access_roles:
            - ROLE_ADMIN
        access_checker: null
        allow_unauthenticated: false

when@dev:
    nowo_http_log:
        sampling_rate: 1.0
        capture:
            response_body_by_type:
                html: false
                json: true
                text: true

when@test:
    nowo_http_log:
        # Avoid persisting every PHPUnit request; admin UI remains available.
        enabled: false
        async: false

when@prod:
    nowo_http_log:
        sampling_rate: 0.25
        capture:
            request_body: false
            max_body_bytes: 16384
            response_body_by_type:
                html: false
                json: false
                soap: false
                xml: false
                text: false
                binary: false
                other: false
        retention:
            days: 14
        export:
            max_sync_rows: 500
        security:
            access_roles: [ROLE_ADMIN]
            allow_unauthenticated: false
