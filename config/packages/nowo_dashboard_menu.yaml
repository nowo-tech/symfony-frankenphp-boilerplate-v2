# nowo-tech/dashboard-menu-bundle
# https://github.com/nowo-tech/DashboardMenuBundle
# Administration pages: UiKit 2 scaffolds (DashboardMenu ≥2.7) in nowo_ui_kit.layouts.admin
# (layouts/ui_admin.html.twig), classes from nowo_ui_kit.theme, UiKit dialogs; no templates/bundles/ copy.
nowo_dashboard_menu:
    locales: '%fallback_locales%'
    default_locale: '%default_locale%'
    cache:
        ttl: 60
        pool: cache.app
    # Disabled: Envelope ingest already uses /api/*; menus are rendered via Twig.
    api:
        enabled: false
        path_prefix: /api/menu
    web_ui:
        enabled: true
    dashboard:
        # Empty (not null): skip bundle stimulus-live.js which imports esm.sh (blocked by script-src 'self').
        # Host Vite app already boots Stimulus + UX Live and exposes window.Stimulus.
        stimulus_script_url: ''
        # Host Vite app registers Symfony UX Autocomplete + Tom Select styles: never load them from esm.sh /
        # jsDelivr (strict CSP, no Bootstrap tom-select CSS over Tailwind) — DashboardMenu 2.3.2.
        autocomplete_bootstrap: false
        modals:
            menu_form: normal
            copy: normal
            item_form: normal
            delete: normal
        route_name_exclude_patterns:
            - '^_'
            - '^web_profiler'
            - '^nowo_auth_kit'
            - '^ingest_'
            - '^ux_'
            - '^live_component'
            - '^admin_api_doc'
        pagination:
            enabled: true
            per_page: 20
        id_options:
            - 'main-menu-navigation'
            - 'dashboard-menu-navigation'
            - 'preferences-menu-navigation'
            - 'administration-menu-navigation'
        item_span_active: false
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false

when@prod:
    nowo_dashboard_menu:
        security:
            allow_unauthenticated: false
            access_roles: [ROLE_ADMIN]
