# nowo-tech/cookie-consent-bundle
# https://github.com/nowo-tech/CookieConsentBundle
nowo_cookie_consent:
    doctrine:
        table_prefix: ''

    # Optional categories (required is always shown)
    categories:
        - analytics
        - preferences

    use_logger: true
    use_database_config: true
    use_cookie_inventory: true
    granular_cookie_selection: false

    # Match Nowo Shell locales (DEFAULT_LOCALE / kernel.default_locale + enabled list)
    default_locale: '%default_locale%'
    enabled_locales: '%fallback_locales%'
    detect_locale_from_accept_language: true

    # Nowo Shell uses Tailwind 4
    ui_theme: tailwind

    # Admin Web UI: UiKit 2 page contract (CookieConsent ≥1.16) — the pages extend UiKit scaffolds in
    # nowo_ui_kit.layouts.admin (layouts/ui_admin.html.twig), classes from nowo_ui_kit.theme; no page forks.
    # Admin routes are always /cookie-consent-config/… (web_ui.path_prefix deprecated and ignored since 1.15).
    web_ui:
        enabled: true
        list_page_size: 20
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false

    # Skin: CookieConsent ≥1.9 ships CSP-safe `nowo-cookie-consent.css` (imported in Vite app bundle;
    # layouts set data-nowo-cookie-consent-external-css). Modal layout/position (bottom-left, equal-weight
    # buttons) lives on the DB profile seeded from src/Setup/Demo/fixtures/cookie_consent.default.json.
    color_theme: light
    dark_mode_enabled: false
    disable_page_interaction: true

    # Floating cookie bubble only on login/register (included manually in AuthKit layout).
    preferences_bubble_enabled: false
    preferences_bubble_position: bottom-right
    # Custom bubble art (YAML fallback when DB profile icon is empty).
    # Inline SVG (CookieConsent ≥1.17 sanitizes the icon: no <img>/external refs, no filters) — public/illustrations/cookie-consent-bubble.svg without its drop shadow.
    preferences_bubble_icon: '<svg class="nowo-cookie-consent__preferences-bubble-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="62" height="62" viewBox="0 0 512 512"><defs><radialGradient id="shell-cc-cookieGradient" cx="38%" cy="30%" r="72%"><stop offset="0%" stop-color="#FFE7A1"/><stop offset="58%" stop-color="#FFC95F"/><stop offset="100%" stop-color="#EE922D"/></radialGradient><linearGradient id="shell-cc-edgeGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E98524"/><stop offset="100%" stop-color="#C86418"/></linearGradient><linearGradient id="shell-cc-cheekGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF9C98"/><stop offset="100%" stop-color="#FF6E88"/></linearGradient><radialGradient id="shell-cc-chipGradient" cx="32%" cy="26%" r="78%"><stop offset="0%" stop-color="#9B5A33"/><stop offset="45%" stop-color="#6E3219"/><stop offset="100%" stop-color="#3F1A0D"/></radialGradient><mask id="shell-cc-cookieMask"><rect width="512" height="512" fill="black"/><circle cx="256" cy="267" r="168" fill="white"/><circle cx="394" cy="122" r="34" fill="black"/><circle cx="422" cy="147" r="34" fill="black"/><circle cx="435" cy="183" r="32" fill="black"/></mask><clipPath id="shell-cc-cookieClip"><circle cx="256" cy="267" r="164"/></clipPath></defs><g opacity=".95"><path d="M86 132l10-21 10 21 21 10-21 10-10 21-10-21-21-10z" fill="#65D8CC"/><path d="M421 139l7-15 7 15 15 7-15 7-7 15-7-15-15-7z" fill="#FF8EAB"/><path d="M435 344l8-17 8 17 17 8-17 8-8 17-8-17-17-8z" fill="#A58BFF"/><circle cx="104" cy="355" r="10" fill="#A58BFF"/><circle cx="405" cy="91" r="8" fill="#FFB347"/><circle cx="105" cy="83" r="9" fill="#FF94AA"/><circle cx="455" cy="256" r="7" fill="#6EDCCF"/></g><g fill="none" stroke="url(#shell-cc-edgeGradient)" stroke-width="13" stroke-linecap="round"><path d="M109 282c-34-14-48-37-57-62"/><path d="M403 286c33-13 47-36 56-60"/></g><g fill="#FFD676" stroke="#D87822" stroke-width="6"><circle cx="49" cy="213" r="14"/><circle cx="462" cy="219" r="14"/></g><g><circle cx="256" cy="267" r="172" fill="url(#shell-cc-edgeGradient)" mask="url(#shell-cc-cookieMask)"/><circle cx="256" cy="267" r="163" fill="url(#shell-cc-cookieGradient)" mask="url(#shell-cc-cookieMask)"/></g><g clip-path="url(#shell-cc-cookieClip)" fill="#FFF0B9" opacity=".68"><circle cx="178" cy="154" r="7"/><circle cx="218" cy="128" r="5"/><circle cx="306" cy="147" r="6"/><circle cx="146" cy="230" r="5"/><circle cx="351" cy="251" r="7"/><circle cx="181" cy="342" r="6"/><circle cx="307" cy="371" r="7"/><circle cx="254" cy="414" r="5"/><circle cx="120" cy="304" r="5"/><circle cx="376" cy="321" r="5"/></g><g fill="url(#shell-cc-chipGradient)"><circle cx="184" cy="174" r="15"/><circle cx="300" cy="163" r="13"/><circle cx="351" cy="222" r="16"/><circle cx="145" cy="282" r="14"/><circle cx="198" cy="367" r="16"/><circle cx="320" cy="377" r="14"/><circle cx="271" cy="227" r="11"/></g><g fill="#D99A74" opacity=".8"><circle cx="179" cy="168" r="5"/><circle cx="296" cy="159" r="4"/><circle cx="346" cy="216" r="5"/><circle cx="140" cy="277" r="4"/><circle cx="193" cy="361" r="5"/><circle cx="316" cy="372" r="4"/><circle cx="267" cy="223" r="3.5"/></g><g><ellipse cx="206" cy="267" rx="18" ry="24" fill="#3A1C14"/><ellipse cx="306" cy="267" rx="18" ry="24" fill="#3A1C14"/><circle cx="200" cy="259" r="6" fill="#FFFFFF"/><circle cx="300" cy="259" r="6" fill="#FFFFFF"/><ellipse cx="166" cy="302" rx="28" ry="14" fill="url(#shell-cc-cheekGradient)" opacity=".86"/><ellipse cx="346" cy="302" rx="28" ry="14" fill="url(#shell-cc-cheekGradient)" opacity=".86"/><path d="M221 301c7 23 24 35 35 35s28-12 35-35c2-7-5-12-11-7-8 7-16 10-24 10s-16-3-24-10c-6-5-13 0-11 7z" fill="#3A1C14"/><path d="M235 321c7 8 14 11 21 11s15-3 21-11c-8-7-14-9-21-9s-13 2-21 9z" fill="#FF7E91"/><path d="M237 319c6-3 12-5 19-5 7 0 13 2 19 5" fill="none" stroke="#FFB1BA" stroke-width="3" stroke-linecap="round"/></g><g fill="#D97824"><circle cx="394" cy="420" r="9"/><circle cx="417" cy="404" r="6"/><circle cx="91" cy="405" r="7"/><circle cx="73" cy="423" r="4.5"/></g><g fill="#FFFFFF" opacity=".82"><circle cx="165" cy="207" r="5"/><circle cx="363" cy="302" r="5"/><circle cx="236" cy="147" r="4"/><circle cx="278" cy="395" r="4"/></g></svg>'
    preferences_bubble_border_color: '#EE922D'

    # Auto-open the consent modal only on public auth entry points (guest shell).
    route_targeting_mode: only
    target_routes:
        - nowo_auth_kit_login
        - nowo_auth_kit_login_unlocalized
        - nowo_auth_kit_register
        - nowo_auth_kit_register_unlocalized
        - nowo_auth_kit_magic_login_request
        - nowo_auth_kit_magic_login_request_unlocalized
        - nowo_auth_kit_reset_password_request
        - nowo_auth_kit_reset_password_request_unlocalized
        - nowo_auth_kit_qr_login_start
        - nowo_auth_kit_qr_login_start_unlocalized

    # Do not auto-open the modal on legal pages (still render for “Manage cookies”).
    disabled_routes:
        - legal_privacy
        - legal_notice
        - legal_terms
        - legal_cookies

    # CookieConsent ≥1.6.3: whitelist public HTML shells only (deny list empty — whitelist is enough).
    # Authenticated product/admin/kit routes never match → no consent markup / inventory queries.
    render_routes:
        - legal_*
        - nowo_auth_kit_*
        - nowo_site_backup_setup*
        - guest_locale_switch
        - app_home_redirect
    skip_render_routes: []

    # CSRF enabled: modal JS (bundle ≥1.4.8) prepares Symfony SameOrigin double-submit
    # for XHR (native submit never fires). Keep aligned with framework.csrf_protection.
    csrf_protection: true
    http_only: true

    # Without this, the form has no action → browser/XHR POSTs to the current page
    # (e.g. /login → 400) and the modal never closes.
    form_action: nowo_cookie_consent.show

    # First-party cookies used by this Nowo Shell instance (YAML fallback when DB inventory is empty).
    # Names must match CookieConsentBundle CookieNameEnum + Symfony session / remember_me / CSRF.
    cookie_inventory:
        - name: NOWO_SHELL_SESSID
          duration: 1 day
          category: required
          type: first_party
          sort_order: 0
          translations:
              en:
                  provider: App (first-party)
                  purpose: Maintains the authenticated HTTP session required to access protected areas of the service (up to 1 day without Remember me).
              es:
                  provider: App (primera parte)
                  purpose: Mantiene la sesión HTTP autenticada necesaria para acceder a las áreas protegidas del servicio (hasta 1 día sin Recordarme).
        - name: REMEMBERME
          duration: 30 days
          category: required
          type: first_party
          sort_order: 10
          translations:
              en:
                  provider: App (first-party)
                  purpose: Enables persistent authentication when the user selects “Remember me” at sign-in (secure token; up to 30 days).
              es:
                  provider: App (primera parte)
                  purpose: Permite la autenticación persistente cuando el usuario selecciona «Recordarme» al iniciar sesión (token seguro; hasta 30 días).
        - name: csrf-token_*
          duration: Session
          category: required
          type: first_party
          sort_order: 15
          translations:
              en:
                  provider: App (first-party)
                  purpose: Short-lived double-submit CSRF cookie set by Symfony when submitting protected forms (name pattern csrf-token_<token>; __Host- prefix on HTTPS).
              es:
                  provider: App (primera parte)
                  purpose: Cookie CSRF de doble envío de corta duración que Symfony establece al enviar formularios protegidos (patrón csrf-token_<token>; prefijo __Host- en HTTPS).
        - name: Cookie_Consent
          duration: 1 year
          category: required
          type: first_party
          sort_order: 20
          translations:
              en:
                  provider: App (first-party)
                  purpose: Records that a cookie-consent decision was made so the banner is not shown again until preferences change or expire.
              es:
                  provider: App (primera parte)
                  purpose: Registra que se tomó una decisión de consentimiento de cookies para no volver a mostrar el aviso hasta que se modifiquen o caduquen las preferencias.
        - name: Cookie_Consent_Key
          duration: 1 year
          category: required
          type: first_party
          sort_order: 30
          translations:
              en:
                  provider: App (first-party)
                  purpose: Anonymous technical key linking the browser consent record to the server-side consent audit log (accountability).
              es:
                  provider: App (primera parte)
                  purpose: Clave técnica anónima que vincula el registro de consentimiento del navegador con el registro de auditoría en el servidor (responsabilidad).
        - name: Cookie_Category_analytics
          duration: 1 year
          category: required
          type: first_party
          sort_order: 40
          translations:
              en:
                  provider: App (first-party)
                  purpose: Stores whether the analytics category was accepted or refused (consent machinery; not an analytics tracker itself).
              es:
                  provider: App (primera parte)
                  purpose: Almacena si la categoría de analítica fue aceptada o rechazada (mecanismo de consentimiento; no es un rastreador de analítica).
        - name: Cookie_Category_preferences
          duration: 1 year
          category: required
          type: first_party
          sort_order: 50
          translations:
              en:
                  provider: App (first-party)
                  purpose: Stores whether the preferences category was accepted or refused (consent machinery).
              es:
                  provider: App (primera parte)
                  purpose: Almacena si la categoría de preferencias fue aceptada o rechazada (mecanismo de consentimiento).
        - name: di_obs
          duration: 1 hour
          category: required
          type: first_party
          sort_order: 60
          translations:
              en:
                  provider: App (first-party)
                  purpose: HttpOnly device-observation pointer used to recognise returning browsers for account security (abuse prevention). It is not a login credential.
              es:
                  provider: App (primera parte)
                  purpose: Puntero HttpOnly de observación de dispositivo para reconocer navegadores conocidos (seguridad de la cuenta). No es una credencial de acceso.
