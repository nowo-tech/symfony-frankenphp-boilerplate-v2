# nowo-tech/routing-kit-bundle — DB/JSON locale paths + admin panel
# https://github.com/nowo-tech/RoutingKitBundle
# Dual public URLs for #[Routable] app routes; AuthKit/SiteBackup keep their own locale config.
nowo_routing_kit:
    enabled: true
    default_locale: '%default_locale%'
    locales: '%fallback_locales%'
    storage:
        paths_file: '%kernel.project_dir%/var/routing_kit/paths.json'
    discovery:
        # Controllers live under domain folders (no src/Controller).
        scan_dirs:
            - '%kernel.project_dir%/src/Shared/Legal/Controller'
            - '%kernel.project_dir%/src/Shared/Locale'
            - '%kernel.project_dir%/src/Shared/Controller'
            - '%kernel.project_dir%/src/Identity/Controller'
            - '%kernel.project_dir%/src/Shared/Settings/Controller'
            - '%kernel.project_dir%/src/Shared/Appearance/Controller'
    panel:
        allow_controller_override: false
        max_definitions: 500
        list_page_size: 50
        reject_conflicts: true
    # UiKit 2 page contract (RoutingKit ≥1.9): the panel extends UiKit scaffolds in nowo_ui_kit.layouts.admin
    # (layouts/ui_admin.html.twig), classes from nowo_ui_kit.theme, deletes in UiKit confirm dialogs (CSP-safe).
    web_ui:
        enabled: true
        path_prefix: '/admin/_routing'
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    redirects:
        canonical_enabled: true
        canonical_status: 301
        root_enabled: false
    auto_invalidate_cache: true
    # Bare path for DEFAULT_LOCALE (same idea as AuthKit unlocalized: serve).
    register_unprefixed_default: true
    # SeoKit not installed — bridge no-ops when SeoPathBuilderInterface is absent.
    seo_kit_bridge: true
