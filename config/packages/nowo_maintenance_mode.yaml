# nowo-tech/maintenance-mode-bundle — public 503 page + admin panel + preview
# Panel (ROLE_ADMIN): /admin/maintenance · Preview: /_maintenance_preview
# Same access pattern as HttpLog / DashboardMenu (login + access_roles; no ops password gate).
nowo_maintenance_mode:
    enabled: true
    default_message: "We're making a few gentle improvements. Everything you care about is safe."
    status_code: 503
    retry_after: 3600

    preview:
        # null = on when kernel.debug (like /_error/503)
        enabled: ~
        path: '/_maintenance_preview'

    # Public 503 page: the bundle page on the guest layout (layouts/ui_guest.html.twig) + the app's 503 art and the
    # countdown to the scheduled end (thin block override, no fork under templates/bundles/).
    templates:
        page: 'maintenance/page.html.twig'

    # UiKit 2 page contract (MaintenanceMode ≥1.10): panel / history extend UiKit scaffolds in nowo_ui_kit.layouts.admin
    # (layouts/ui_admin.html.twig), classes from nowo_ui_kit.theme; the thin index adds the 503 preview link.
    web_ui:
        enabled: true
        path_prefix: '/admin/maintenance'
        templates:
            index: 'kit/maintenance_mode_panel_index.html.twig'

    security:
        allow_unauthenticated: false
        access_roles: [ROLE_ADMIN]
        access_checker: null
        password_protection: false

    exclusions:
        paths:
            - /health/live
            - /health/ready
            - /favicon.ico
            - /manifest.webmanifest
            - /sw.js
            - /offline
        path_prefixes:
            - /build/
            - /assets/
            - /bundles/
            - /icons/
            - /_wdt
            - /_profiler
            - /_error
            - /_site_backup
            - /_device
            - /setup
            - /login
            - /register
            - /logout
            - /reset-password
        patterns:
            - '#^/(en|es|de|nl|fr|it|pt)/(login|register|logout|reset-password|setup)(/|$|\?)#'

when@prod:
    nowo_maintenance_mode:
        preview:
            enabled: false
        security:
            access_roles: [ROLE_ADMIN]
            allow_unauthenticated: false

when@test:
    nowo_maintenance_mode:
        preview:
            # Coverage runs use APP_DEBUG=0: the default (~ = kernel.debug) would 404 the preview.
            enabled: true
