# FrankenPHP Hot Reload — development only (do not enable in production).
# nowo-tech/hot-reload-bundle (require-dev). Never register in prod.
# Docs: https://github.com/nowo-tech/HotReloadBundle + docs/ops/FRANKENPHP-HOT-RELOAD.md

when@dev: &nowo_hot_reload
    nowo_hot_reload:
        enabled: true
        auto_inject: true
        # shared_worker = one Mercure SSE for all tabs (HTTP/1.1-safe; needs worker-src 'self').
        client_mode: shared_worker
        csp_nonce_request_attribute: '_shell_csp_nonce'
        idiomorph: true
        preserve_selectors:
            - '[id^="sfwdt"]'
            - '.sf-toolbar'
            - '.sf-minitoolbar'
            - '[id^="_twig_inspector"]'
        preserve_observe: true
        csp_augment_script_src: true
        csp_script_src_hosts:
            - 'https://cdn.jsdelivr.net'

when@test: *nowo_hot_reload
