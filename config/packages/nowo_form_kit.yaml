# nowo-tech/form-kit-bundle
# https://github.com/nowo-tech/FormKitBundle
#
# default_profile shell = host form profile (host form profile id).
# Named kit profiles (auth_kit, dashboard_menu, …) stop vendor prepend from seeding
# Bootstrap field classes when those bundles require FormKit.
nowo_form_kit:
    default_profile: shell
    css_framework: tailwind
    # FormKit ≥2.4.0 already maps snake-case `search` → Symfony SearchType (REQ-FORMKIT-007).
    profiles:
        shell: &shell_profile
            alias: shell
            # Host FormKit catalogues live in translations/form.*.yaml
            # ({form}.{field}.label|placeholder|help). Kit profiles below override.
            translation_domain: form
            auto_placeholder: true
            auto_help: true
            required_label_suffix: null
            defaults:
                attr:
                    class: 'input'
                row_attr:
                    class: 'flex flex-col gap-2'
            field_types:
                textarea:
                    attr:
                        class: 'input'
                        rows: 3
                checkbox:
                    attr:
                        class: 'checkbox'
                    row_attr:
                        class: 'flex items-center gap-2'
                choice:
                    attr:
                        class: 'input'
                submit:
                    help: false
            help_modal:
                framework: tailwind
                icon_html: '<span aria-hidden="true">?</span>'

        # AuthKit 1.14+ (#[FormKitConfig] auth_kit) — match Shell inputs.
        # FormKit 2.2+ inherits form-level translation_domain; keep catalogue + auto_* off.
        auth_kit:
            <<: *shell_profile
            alias: auth_kit
            translation_domain: NowoAuthKitBundle
            auto_placeholder: false
            auto_help: false

        # DashboardMenu 2.x / BreadcrumbKit 2.0.14+ / HttpLog 1.1+ admin forms.
        # Host-defined profiles skip vendor domain seed — set kit catalogues explicitly.
        dashboard_menu:
            <<: *shell_profile
            alias: dashboard_menu
            translation_domain: NowoDashboardMenuBundle
            auto_placeholder: false
            auto_help: false

        breadcrumb_kit:
            <<: *shell_profile
            alias: breadcrumb_kit
            translation_domain: NowoBreadcrumbKitBundle
            auto_placeholder: false
            auto_help: false

        http_log:
            <<: *shell_profile
            alias: http_log
            translation_domain: NowoHttpLogBundle
            auto_placeholder: false
            auto_help: false

        # CookieConsent FormKit forms label keys live in NowoCookieConsentBundle, not messages.
        cookie_consent:
            <<: *shell_profile
            alias: cookie_consent
            translation_domain: NowoCookieConsentBundle
            auto_placeholder: false
            auto_help: false

        # RoutingKit 1.3+ panel form (#[FormKitConfig] routing_kit).
        routing_kit:
            <<: *shell_profile
            alias: routing_kit
            translation_domain: NowoRoutingKitBundle
            auto_placeholder: false
            auto_help: false

        # GET list filters — own FormKit profile (not shell).
        # Wire via AbstractGetFilterType (#[FormKitConfig('filter')]).
        #
        # Contract (FormKit >= 2.4.0):
        #   - label: never (defaults.label: false)
        #   - placeholder: always (auto_placeholder: true)
        #   - help: always (auto_help: true), unless field sets help: false
        #   - required: always false (defaults.required: false) except per_page
        filter:
            <<: *shell_profile
            alias: filter
            translation_domain: form
            auto_placeholder: true
            auto_help: true
            defaults:
                attr:
                    class: 'input'
                row_attr:
                    class: ''
                label: false
                required: false
            field_types:
                text:
                    label: false
                search:
                    label: false
                textarea:
                    label: false
                integer:
                    label: false
                number:
                    label: false
                email:
                    label: false
                password:
                    label: false
                checkbox:
                    label: false
                choice:
                    label: false
                    placeholder: false
                hidden:
                    label: false
                    placeholder: false
                submit:
                    help: false
