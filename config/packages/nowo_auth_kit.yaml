# nowo-tech/auth-kit-bundle — first-user bootstrap + i18n + remember me
# https://github.com/nowo-tech/AuthKitBundle
# Dual auth URLs: bare /login serves DEFAULT_LOCALE (unlocalized: serve); /{_locale}/login for other locales.
nowo_auth_kit:
    default_profile: default
    outbound_mail_ready_checker: App\Identity\AuthKit\OutboundMailReadyChecker
    locale:
        in_path: both
        default: '%default_locale%'
        enabled: '%fallback_locales%'
        unlocalized: serve
    profiles:
        default:
            user_class: App\Identity\Entity\User
            user_identifier_field: email
            registration_mode: first_user_only
            registration_role: ROLE_ADMIN
            login_success_route: dashboard_home
            firewall: main
            login_fields:
                - identifier
                - password
                - remember_me
            registration_fields:
                - email
                - displayName
                - password
                - name: terms
                  type: checkbox
                  required: true
                  slide_to_confirm: true

            # AuthKit 1.18 — optional nowo-tech/slide-to-confirm-bundle (UX only; CSRF/authz stay on the form).
            slide_to_confirm:
                enabled: true
                registration_consent: gate
                # QR Approve stays a button while qr_login.mode is disabled (AUTH-005).
                qr_login_approve: false

            # AuthKit 1.19 — optional nowo-tech/device-intelligence-bundle (Device ID is not a credential).
            device_intelligence:
                enabled: true
                collect_on_auth_pages: true
                collect_endpoint: /_device/collect
                new_device_notify: true
                device_rate_limit: true
                qr_login:
                    # Requires an explicit trust grant; AuthKit never auto-trusts after login.
                    approve_require_trusted: false

            # AuthKit 1.20 — nowo-tech/otp-input-bundle on /reset-password/complete (UX only).
            otp_input:
                enabled: true
                password_reset_code: true

            remember_me:
                enabled: true
                # Keep in sync with security.firewalls.main.remember_me.lifetime (30 days).
                lifetime: 2592000
                path: /
            password_strength:
                enabled: true
                level: medium
                policy_mode: level
            password_reset:
                mode: enabled
                # link + OTP code (AuthKit delivery: link | code | both)
                delivery: both
                token_ttl: 3600
                token_field: passwordResetToken
                token_expires_field: passwordResetExpiresAt
                # Drives OtpType length / numeric_only when otp_input is enabled.
                code_length: 6
                code_charset: numeric
            magic_login:
                mode: enabled
                lifetime: 600
                max_uses: 1
                # Pair with security.login_link.check_post_only (AuthKit 1.16+).
                confirm_interstitial: true
            # OAuth buttons appear only when mode=enabled AND ≥1 enabled row in auth_kit_social_credential.
            # create_user_if_missing:false — link existing users by email (avoids ROLE_ADMIN social sign-ups).
            social_login:
                mode: enabled
                create_user_if_missing: false
            # QR phone login (AuthKit 1.12). Disabled until a real phone OTP / verification
            # path sets User.phoneVerifiedAt (profile save only clears or restores it).
            qr_login:
                mode: disabled
                challenge_ttl: 90
                approve_requires: session
                desktop_binding: strict
                phone_field: phone
                phone_verified_field: phoneVerifiedAt
            embed:
                mode: disabled
            # AuthKit 1.27 page contract (REQ-UI-003): every auth page extends the UiKit auth scaffold and renders in
            # nowo_ui_kit.layouts.guest (layouts/ui_guest.html.twig: guest shell, brand hero, cookie preferences bubble,
            # password toggle / strength assets). Buttons come from nowo_ui_kit.theme.pages.auth. No template under
            # templates/bundles/NowoAuthKitBundle/; thin @!NowoAuthKit block overrides only.
            web_ui:
                # App field chrome (input / checkbox-label / password toggle) + OTP widget.
                form_themes:
                    - '@NowoOtpInputBundle/Form/otp_input_theme.html.twig'
                    - form/password_strength_app_theme.html.twig
                    - form/auth_kit_theme.html.twig
                templates:
                    # + link to the code-entry page (password_reset.delivery: both); AuthKit links it nowhere.
                    reset_request: auth/reset_request.html.twig
            routes:
                login:
                    path: /login
                    name: nowo_auth_kit_login
                logout:
                    path: /logout
                    name: nowo_auth_kit_logout
                register:
                    path: /register
                    name: nowo_auth_kit_register
                reset_request:
                    path: /reset-password
                    name: nowo_auth_kit_reset_password_request
                reset_password:
                    path: /reset-password/reset/{token}
                    name: nowo_auth_kit_reset_password
                reset_password_code:
                    path: /reset-password/complete
                    name: nowo_auth_kit_reset_password_code
                magic_login_request:
                    path: /login/magic
                    name: nowo_auth_kit_magic_login_request
                magic_login_check:
                    path: /login/magic/check
                    name: nowo_auth_kit_magic_login_check
                magic_login_confirm:
                    path: /login/magic/confirm
                    name: nowo_auth_kit_magic_login_confirm
                social_login_start:
                    path: /login/social/{provider}
                    name: nowo_auth_kit_social_login_start
                social_login_check:
                    path: /login/social/{provider}/check
                    name: nowo_auth_kit_social_login_check
                qr_login_start:
                    path: /login/qr
                    name: nowo_auth_kit_qr_login_start
                qr_login_show:
                    path: /login/qr/{id}
                    name: nowo_auth_kit_qr_login_show
                qr_login_status:
                    path: /login/qr/{id}/status
                    name: nowo_auth_kit_qr_login_status
                qr_login_complete:
                    path: /login/qr/{id}/complete
                    name: nowo_auth_kit_qr_login_complete
                qr_login_approve:
                    path: /login/qr/{id}/approve
                    name: nowo_auth_kit_qr_login_approve
                qr_login_deny:
                    path: /login/qr/{id}/deny
                    name: nowo_auth_kit_qr_login_deny
